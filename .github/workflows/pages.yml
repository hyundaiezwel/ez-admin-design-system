name: Pages

# 확정된 PrimeVue 판 스파이크를 라이브 데모로 배포한다.
#
# Nuxt UI 판은 **배포하지 않는다.** 선정 근거 기록으로 저장소에만 남기고 더 갱신하지 않기로
# 했는데(팔레트 사본이 @ezwel/ui v1.0.0에 멈춰 있다), 그걸 나란히 띄우면 어느 쪽이 현재
# 기준인지 헷갈린다.
#
# 조직 플랜이 free라 **저장소가 public일 때만 동작한다**(private Pages는 Enterprise Cloud 전용).
# 켜는 법: Settings > Pages > Source = "GitHub Actions"

# 이 저장소는 private을 유지하기로 했다(2026-09-19). free 플랜에서 private Pages는
# 안 되므로 push마다 돌리면 deploy 잡이 매번 실패해 빨간 X만 쌓인다.
# **수동 실행만** 남긴다 — 공개로 바꾸는 날 push 트리거를 되살리면 된다.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # @ezwel/ui 는 이제 public이라 토큰 없이 받아진다. 다시 private으로 돌리면
      # 읽기 권한 PAT(저장소 시크릿 EZ_UI_TOKEN)만 넣으면 이 단계가 살아난다.
      - name: private 의존성 인증
        if: env.EZ_UI_TOKEN != ''
        env:
          EZ_UI_TOKEN: ${{ secrets.EZ_UI_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${EZ_UI_TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: npm ci
      - run: npm run build -w @spike/primevue
        env:
          PAGES_BASE: /ez-admin-design-system/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: spike/primevue/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
